name: Openwrt-AutoBuild

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '编译OpenWrt固件-SSH远程：改为“ssh”打开SSH连接'
        required: false
        default: 'ssh-actions'

  # 定时触发编译（UTC 06:00 = UTC+8 14:00）
  schedule:
    - cron: '0 6 * * *'

env:
  RUN_VALIDATION: true

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'XiaoTanTV'
    name: Build ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - OpenWrt25.12
          - OpenWrtSNAPSHOT

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v6

      # ============================================================
      # Set Date
      # ============================================================
      - name: Set Date
        run: |
          sudo timedatectl set-timezone 'Asia/Shanghai'
          date=$(date +%Y%m%d)
          echo "DATE=$date" >> "$GITHUB_ENV"

      # ============================================================
      # Maximize build space
      # ============================================================
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'

      # ============================================================
      # Check build space
      # ============================================================
      - name: Build
        run: |
          echo "Free space:"
          df -h

      # ============================================================
      # Initialization environment
      # ============================================================
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi $(docker images -q) || true

          sudo rm -rf \
            /swapfile \
            /etc/apt/sources.list.d/* \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc

          sudo -E apt-get -qq update

          sudo -E apt -qq -y purge \
            azure-cli* \
            docker* \
            ghc* \
            zulu* \
            firefox \
            google* \
            dotnet* \
            powershell* \
            openjdk* \
            mysql* \
            php* \
            mongodb* \
            snap*

          sudo -E apt -qq -y full-upgrade

          sudo -E apt-get -qq -y install \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            lld \
            llvm \
            libclang-dev \
            cmake \
            libffi-dev \
            libncursesw5-dev

          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

          sudo -E timedatectl set-timezone "Asia/Shanghai"

      # ============================================================
      # Load Settings.ini
      # ============================================================
      - name: Load Settings.ini
        run: |
          source "${GITHUB_WORKSPACE}/user/${{matrix.target}}/settings.ini

          echo "REPO_URL=${REPO_URL}" >> "$GITHUB_ENV"
          echo "REPO_BRANCH=${REPO_BRANCH}" >> "$GITHUB_ENV"

          echo "UPLOAD_PACKAGES_DIR=${UPLOAD_PACKAGES_DIR}" >> "$GITHUB_ENV"
          echo "UPLOAD_TARGETS_DIR=${UPLOAD_TARGETS_DIR}" >> "$GITHUB_ENV"
          echo "UPLOAD_FIRMWARE=${UPLOAD_FIRMWARE}" >> "$GITHUB_ENV"

          echo "UPLOAD_TO_ARTIFACTS=${UPLOAD_TO_ARTIFACTS}" >> "$GITHUB_ENV"
          echo "UPLOAD_TO_REALEASE=${UPLOAD_TO_REALEASE}" >> "$GITHUB_ENV"
          echo "UPLOAD_TO_COWTRANSFER=${UPLOAD_TO_COWTRANSFER}" >> "$GITHUB_ENV"

          echo "WECHAT_NOTIFICATION=${WECHAT_NOTIFICATION}" >> "$GITHUB_ENV"

          echo "DELETE_RELEASE=${DELETE_RELEASE}" >> "$GITHUB_ENV"
          echo "DELETE_ARTIFACTS=${DELETE_ARTIFACTS}" >> "$GITHUB_ENV"

      # ============================================================
      # Clone source code
      # ============================================================
      - name: Clone source code
        run: |
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt

      # ============================================================
      # Apply Patches
      # ============================================================
      - name: Apply Patches
        run: |
          echo "Apply common patches"

          if [ -n "$(ls -A "user/common/patches" 2>/dev/null)" ]; then
            find "user/common/patches" \
              -type f \
              -name '*.patch' \
              -print0 |
              sort -z |
              xargs -I % -t -0 -n 1 \
              sh -c "cat '%' | patch -d 'openwrt' -p0 --forward"
          fi

          echo "Apply target patches"

          if [ -n "$(ls -A "user/${{ matrix.target }}/patches" 2>/dev/null)" ]; then
            find "user/${{ matrix.target }}/patches" \
              -type f \
              -name '*.patch' \
              -print0 |
              sort -z |
              xargs -I % -t -0 -n 1 \
              sh -c "cat '%' | patch -d 'openwrt' -p0 --forward"
          fi

      # ============================================================
      # Update feeds
      # ============================================================
      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      # ============================================================
      # Install feeds
      # ============================================================
      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      # ============================================================
      # Load custom configuration
      # ============================================================
      - name: Load custom configuration
        run: |
          echo "Apply files..."

          if [ -n "$(ls -A "user/common/files" 2>/dev/null)" ]; then
            cp -r -f user/common/files/* \
              openwrt/package/base-files/files/
          fi

          if [ -n "$(ls -A "user/${{ matrix.target }}/files" 2>/dev/null)" ]; then
            cp -r -f "user/${{ matrix.target }}/files"/* \
              openwrt/package/base-files/files/
          fi

          echo "Apply custom.sh"

          if [ -f "user/common/custom.sh" ]; then
            (
              cd openwrt
              /bin/bash "../user/common/custom.sh"
            )
          fi

          if [ -f "user/${{ matrix.target }}/custom.sh" ]; then
            (
              cd openwrt
              /bin/bash "../user/${{ matrix.target }}/custom.sh" \
                "${{ matrix.target }}"
            )
          fi

      # ============================================================
      # Cache
      # ============================================================
      - name: Cache
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: x86_64
          prefix: ${{ github.workspace }}/openwrt

      # ============================================================
      # Download packages
      # ============================================================
      - name: Download package
        id: package
        run: |
          cd openwrt

          mv "../user/${{ matrix.target }}/config.diff" .config

          make defconfig
          make download -j8

          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ============================================================
      # Check space
      # ============================================================
      - name: Check space usage
        if: (!cancelled())
        run: |
          df -hT

      # ============================================================
      # Compile firmware
      # ============================================================
      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt

          echo "$(($(nproc)+1)) thread compile"

          make -j$(($(nproc)+1)) || make -j1 V=s

          echo "status=success" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Check space after compile
      # ============================================================
      - name: Check space usage
        if: (!cancelled())
        run: |
          df -hT

      # ============================================================
      # Check generated firmware
      # ============================================================
      - name: Check firmware files
        if: steps.compile.outputs.status == 'success'
        run: |
          echo "===== Target directory ====="
          find openwrt/bin/targets/x86/64/ \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          echo ""
          echo "===== Combined firmware ====="

          ls -lh \
            openwrt/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined.img.gz \
            openwrt/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined-efi.img.gz

      # ============================================================
      # Pack packages
      #
      # Archive is created OUTSIDE the directory being archived.
      # This avoids:
      # tar: ./xxx.tar: file is the archive; not dumped
      # ============================================================
      - name: Pack packages_dir
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/packages

          tar -cvf ../Openwrt-${{ matrix.target }}-packages.tar ./

          echo "===== Package archive ====="
          ls -lh ../Openwrt-${{ matrix.target }}-packages.tar

      # ============================================================
      # Pack targets
      # ============================================================
      - name: Pack targets_dir
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets

          tar -cvf ../Openwrt-${{ matrix.target }}-targets.tar ./

          echo "===== Targets archive ====="
          ls -lh ../Openwrt-${{ matrix.target }}-targets.tar

      # ============================================================
      # Assemble Firmware
      #
      # IMPORTANT:
      # 使用 cp，不使用 mv。
      #
      # Release 上传需要：
      # openwrt/bin/targets/x86/64/xxx.img.gz
      #
      # Artifact 上传需要：
      # ./Firmware/xxx.img.gz
      #
      # cp 可以同时保留两份。
      # ============================================================
      - name: Assemble Firmware
        if: steps.compile.outputs.status == 'success'
        run: |
          rm -rf ./Firmware
          mkdir -p ./Firmware

          find openwrt/bin/targets/ \
            -type f \
            -name "*.img*" \
            -exec cp -fv {} ./Firmware/ \;

          echo ""
          echo "===== Firmware directory ====="
          find ./Firmware \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          echo ""
          echo "===== Firmware count ====="
          find ./Firmware \
            -maxdepth 1 \
            -type f |
            wc -l

      # ============================================================
      # Upload combined firmware to GitHub Release
      #
      # 正确路径：
      # openwrt/bin/targets/x86/64/
      # ============================================================
      - name: Upload combined firmware to release
        if: env.UPLOAD_FIRMWARE == 'true' && env.UPLOAD_TO_REALEASE == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.SUPER_TOKEN }}
          file: openwrt/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined.img.gz
          asset_name: ${{ matrix.target }}-x86-64-generic-squashfs-combined-${{ env.DATE }}.img.gz
          tag: Openwrt-X64-${{ env.DATE }}
          overwrite: true
          file_glob: false

      # ============================================================
      # Upload combined EFI firmware to GitHub Release
      # ============================================================
      - name: Upload combined EFI firmware to release
        if: env.UPLOAD_FIRMWARE == 'true' && env.UPLOAD_TO_REALEASE == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.SUPER_TOKEN }}
          file: openwrt/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined-efi.img.gz
          asset_name: ${{ matrix.target }}-x86-64-generic-squashfs-combined-efi-${{ env.DATE }}.img.gz
          tag: Openwrt-X64-${{ env.DATE }}
          overwrite: true
          file_glob: false

      # ============================================================
      # Upload Packages to CowTransfer
      # ============================================================
      - name: Upload Packages to CowTransfer
        if: env.UPLOAD_PACKAGES_DIR == 'true' && env.UPLOAD_TO_COWTRANSFER == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
        run: |
          curl -fsSL git.io/file-transfer | sh

          ./transfer cow \
            --block 2621440 \
            -s \
            -p 64 \
            --no-progress \
            "openwrt/bin/Openwrt-${{ matrix.target }}-packages.tar"

      # ============================================================
      # Upload Targets to CowTransfer
      # ============================================================
      - name: Upload Targets to CowTransfer
        if: env.UPLOAD_TARGETS_DIR == 'true' && env.UPLOAD_TO_COWTRANSFER == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
        run: |
          curl -fsSL git.io/file-transfer | sh

          ./transfer cow \
            --block 2621440 \
            -s \
            -p 64 \
            --no-progress \
            "openwrt/bin/Openwrt-${{ matrix.target }}-targets.tar"

      # ============================================================
      # Upload packages directory
      # ============================================================
      - name: Upload packages directory
        if: env.UPLOAD_PACKAGES_DIR == 'true' && env.UPLOAD_TO_ARTIFACTS == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-packages-${{ matrix.target }}-${{ env.DATE }}
          path: openwrt/bin/packages

      # ============================================================
      # Upload targets directory
      # ============================================================
      - name: Upload targets directory
        if: env.UPLOAD_TARGETS_DIR == 'true' && env.UPLOAD_TO_ARTIFACTS == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-targets-${{ matrix.target }}-${{ env.DATE }}
          path: openwrt/bin/targets

      # ============================================================
      # Upload assembled firmware
      # ============================================================
      - name: Upload Firmware
        if: env.UPLOAD_FIRMWARE == 'true' && env.UPLOAD_TO_ARTIFACTS == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-firmware-${{ matrix.target }}-${{ env.DATE }}
          path: ./Firmware/
          if-no-files-found: error

      # ============================================================
      # 删除旧版本
      # ============================================================
      - name: 删除旧版本
        uses: dev-drprasad/delete-older-releases@master
        if: env.DELETE_RELEASE == 'true'
        with:
          keep_latest: 7
          delete_tag_pattern: ${{ env.FILE_NAME }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.SUPER_TOKEN }}

      # ============================================================
      # 删除旧的工作流程运行和工件
      # ============================================================
      - name: 删除旧的工作流程运行和工件
        uses: Mattraks/delete-workflow-runs@main
        if: env.DELETE_ARTIFACTS == 'true'
        with:
          token: ${{ secrets.SUPER_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 0

      # ============================================================
      # WeChat notification
      # ============================================================
      - name: WeChat notification
        if: env.WECHAT_NOTIFICATION == 'true' && !cancelled() && steps.compile.outputs.status == 'success'
        run: |
          curl "https://sctapi.ftqq.com/${{ secrets.SCKEY }}.send?text=${{ matrix.target }}-${{ env.DATE }}固件已编译完成"
